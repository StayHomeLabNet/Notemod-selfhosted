name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: fileinfo, mbstring, openssl
          coverage: none
          tools: none

      - name: Lint PHP files
        run: find . -type f -name '*.php' -not -path './config/*' -not -path './notemod-data/*' -not -path './logs/*' -print0 | xargs -0 -n1 php -l

      - name: Run PHP tests
        run: php tests/run.php

      - name: Run HTTP smoke tests
        run: bash tests/http_smoke.sh
